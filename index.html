<title>AliceSmile — Portraits of invisible life</title>
<meta name="description" content="Drawings and pictures by AliceSmile, each with its name. Portraits of invisible life.">
<style>
  :root { --bg: #0b0b0c; --ink: #f2f0eb; --dim: #8a8781; --line: #232326; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; }
  header { text-align: center; padding: 56px 20px 12px; }
  header h1 { font-size: 2.2rem; font-weight: 400; letter-spacing: 0.14em; }
  header p { color: var(--dim); margin-top: 10px; font-style: italic; font-size: 1rem; }
  .section-title { text-align: center; font-size: 1.35rem; font-weight: 400; letter-spacing: 0.12em; margin: 44px 20px 0; }
  .section-sub { text-align: center; color: var(--dim); font-style: italic; font-size: 0.9rem; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; padding: 20px clamp(12px, 4vw, 72px) 40px; max-width: 1400px; margin: 0 auto; }
  .card { cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; display: block; transition: opacity .25s; background: #141416; }
  .card:hover img { opacity: .82; }
  .card h2 { font-size: 0.85rem; font-weight: 400; margin-top: 8px; line-height: 1.4; }
  .card .teaser { font-size: 0.8rem; color: var(--dim); line-height: 1.45; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  header p.intro { font-style: normal; color: var(--ink); margin-top: 14px; font-size: 0.95rem; }
  #lightbox { position: fixed; inset: 0; background: rgba(5,5,6,.96); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  #lightbox.open { display: flex; }
  #lightbox figure { max-width: 1100px; width: 100%; max-height: 92vh; overflow: auto; text-align: center; }
  #lightbox img { max-width: 100%; max-height: 70vh; object-fit: contain; }
  #lightbox figcaption { margin-top: 18px; }
  #lightbox figcaption h2 { font-size: 1.25rem; font-weight: 400; line-height: 1.5; max-width: 800px; margin: 0 auto; }
  #lightbox figcaption .meta { color: var(--dim); font-style: italic; margin-top: 10px; }
  #lightbox figcaption .story { font-size: 1rem; line-height: 1.6; margin-top: 14px; max-width: 800px; margin-left: auto; margin-right: auto; white-space: pre-line; }
  #close { position: fixed; top: 18px; right: 24px; background: none; border: none; color: var(--ink); font-size: 2rem; cursor: pointer; z-index: 51; font-family: inherit; }
  footer { text-align: center; padding: 24px 20px 48px; color: var(--dim); font-size: 0.85rem; font-style: italic; }
</style>
</head>

</header>
<main>
  <section>

  <section>

</div>

const NEW_WORKS = [   { src: "images/the-third-listener.jpg",
    title: "After something that was hiding discovered itself, something unusual happened: Drawingaline's posture. Drawingaline had been seen dancing, sitting on the other side of buckminsterfullerene, flying on stardust or stepping on and into. But that kind of stripe braiding had never happened before: the stripes weren't wrapped around the body. The stripes were the body, like living calligraphy.\n\nThen everyone noticed the third listener. They knew a lot about strange buzzing creatures from science fiction and it was quietly odd to see it for real. No one could determine what the being was listening to. It had arrived because something hidden had become known. Only then AbsentlineD exclaimed, \"Seems we discovered the Earth! Can't believe it's happening in reality!\"\n\nDrawingaline was still immersed in a self-sustaining, braided knot of energy, he watched how the tiny entity converted pure conceptual resonance into sensory noise - typical Earthling behavior. AbsentlineD barely held the moon edge, observing abstract mathematical spaces collapsing into concrete reality with Drawingaline locking himself into a stable, complex state to withstand the immense gravitational pressure. \"So this is Earth,\" he murmured. \"A place where hidden things don't just stay hidden, they grow roots, sprout wings, and start buzzing back at you in dissipation! Where information is bounded stubbornly by thermodynamics, gravity and biology.\"\n\nDrawingaline held the braid of unwrapped stripes, stable and complex, and the knot sustained itself. The third listener listened on, what it heard, nobody determined; the Earth, once discovered, kept discovering itself. And AbsentlineD continued holding the moon's edge, partly because it provided an excellent vantage point and partly because the moon seemed to appreciate being held during moments of ontological significance. On Earth, patterns stayed. They accumulated. A hidden thing could remain hidden long enough to develop history.\n\nThe third listener tilted its head. Nobody could ever quite determine where the creature ended and the vibration began: trapped in flesh, endlessly attempting to escape.\n\n\"What is it listening to?\" someone finally asked. It listened to hidden things giving roots, letting them grow strange enough to notice one another.",
    meta: "White gel on black paper miniature, 2026",
    note: "It listened to hidden things giving roots…" },
{ src: "images/the-sideways-stars.jpg",
    title: "Intervaline was accepted as a new friend immediately. Absentlines shared their buckminsterfullerene trick invented by Drawingaline, with dreams undreamed and wishes unfulfilled in it. Intervaline surprised them even more: he showed the Allwatching Eyes effect explicitly. AbsentlineT fell from buckminsterfullerene immediately, not hiding from eyes, but mostly because he caught a hiccup of surprise. AbsentlineD was accustomed to miracles as he could bend his paw in the opposite direction, plus, the eyes reminded him of the sideways stars they saw not so long ago.\n\nAbsentlineT recovered from his hiccup after three and a half astonished breaths. \"That's impolite,\" he declared. \"It is not impolite,\" said Intervaline. \"What is it then?\" asked AbsentlineT. The nearest eye drifted across the darkness. \"It is simply watching.\" The second eye starred. Nothing happened. The third eye starred. Again, nothing happened. \"Shouldn't we be turning into something?\" AbsentlineT turned suspicious. AbsentlineD turned away. Intervaline stated: \"Many think, being seen changes them.\" \"Doesn't it?\" asked AbsentlineT. Intervaline considered: \"It changes those who are hiding.\"\n\nDrawingaline departed to think through, just on the other side of the buckminsterfullerene. He thought, essentially, eyes are simply present, as natural law, active measurement only collapses a wave function if the state is in hiding, for an open, unhidden reality, looking is merely a passive natural constant that does not mask its properties. But he couldn't comply with the unwrapped lined Intervaline ear. \"A line must enclose or divide,\" Drawingaline thought aloud. \"That ear is dividing nothing. It has no inside and no outside. It is just... continuing!\" \"It isn't continuing to anywhere,\" Intervaline replied softly, his second eye trailed the path of an eye as it passed over their heads. \"It is simply opened in between to listen.\"\n\nAbsentlineT murmured: \"What happens if the open line finally catches something that doesn't want to be found?\" A soundless vibration rippled through the black void, and the drifting eyes all turned at once toward a single, previously invisible point in the empty space between stars. The universe registered a sudden change in its underlying code, because something was actively hiding. The eyes stayed, the open ear line stayed, but who detected it first? \"No one,\" said Drawingaline. \"It found itself.\"",

{ src: "images/the-coil-between-two-shores.jpg",
    title: "Intervaline hare wasn't resting long without being discovered. Of course, Drawingaline and AbsentlineT hare found him pretty soon after lines and their absence bounced back, and the intensity of unknown matter became exclusively sensed. It happened when hares vocalized to each other throughout the space to catch what was left from the echo that never happened. At some moment the voice stuck into the turbulence wave which stretched the coil between two shores of planets hares stand on. The echo play should have been trivial: Drawingaline produced a line-voice, Absentlines produced a gap-voice, both voices were expected to miss each other, as they always had (the whole point of the game), a quantum bridge. Instead, the call departed, the reply departed, neither arrived, yet, resonance appeared. The resonance of the shape of a hare. The Antimatter objected: \"Effects are not permitted to precede causes!\"\n\nOf course, the resonance ignored the complaint. The Intervaline was standing within the vocalize game. The stretched coil connecting the worlds immediately became known as the Intershore Thread. The resonance produced systems with questions taken as facts, opinions as material bodies and, as we already observed, absence as presence with transformation. Meanwhile, Intervaline finally opened its second eye. Not fully, but enough to notice that it looked in a different direction. His first words were: \"If a line may continue from an undefined coordinate... from which coordinate does an unfinished story continue?\"\n\nAnd for the first time, the Jester stopped counting. Suddenly, the voiceless echo game turned into narrative and meaning producing reality, which hares didn't know how to relate, as they used to the game they knew - the frozen arc of absence. But the Intervaline hare knew. He tracked continuous unbroken Drawingaline's line and discrete, empty Absentlines intervals at once, and calculated, as a result, the trajectory of a wave function that has been interrupted but hasn't yet collapsed into its final state.\n\nThe moment Drawingaline's and AbsentlineT's intentions touched Intervaline's vibrating outer coil, the falling stars paused mid-streak. Intervaline's second eye opened fully, gazing directly at the trajectory of the uncollapsed wave. Intervaline whispered, like a spring uncoiling in deep vacuum: \"We are not inside the story. The story is a standing wave.\" The refractive index of unsaid words began to bleed into the horizon's void.\n\nThe borderline kept report: \"Counting suspended,\" the silence commented, the stars stayed mid-streak, waiting to be continued.\nIt was already clear, that events were no longer occurring in sequence and an unfinished memory could alter a completed observation. Intervaline observed opposite directions, Drawingaline observed continuity, AbsentlineT observed discontinuity. Only together could they perceive its outline. This discovery became known as the Plural Observation Principle: reality cannot be seen from a single world.\nThe halted stars began drifting again. Sideways.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026",
    note: "Motto entered into the record:<br>We are not inside the story. The story is a standing wave." },
  { src: "images/the-great-curl-takes-the-floor.jpg",
    title: "Absentlines hares decided to invite Drawingaline hare into their birthplace, as a gesture of polite kindness response, no more. When they crossed their country borderline, the voice waved: \"The Great Curl Takes the Floor!\" All hares at once went into the observation state. Drawingaline lost lines entirely, as the empty spaces arrived in phase with one another. The lines arrived nowhere. This was later recorded as the first documented Unlining under open observation of the Great Curl. The antiwave released a cosmic news: \"Observation Event III: When Empty Spaces Learned to Interfere. Absence becomes the wave. The Great Curl declined to comment\". That's how the Drawingaline hare became a hero of local news in the Absentlines' Universe in the headline story of how Presence becomes the thing that gets canceled. Yet, what news didn't know, that out of the erased coordinates stepped the Phase-Shift Jester! Whose body woven from thousands of intermittent hatch-marks visibly scattered all over like sort of polar lights, and the floating dashes in the air began to align into a brand-new physical constant. Only after! hares realized that the Jester was just that trapped energy boiling back to the surface, simply named \"discretized space-time\": a living diffraction pattern, just like the polar lights, after being observed by the Great Curl. What hares didn't realize, that the Jester introduced the Constant of Intermittent Reality, which dictated exactly how many lines were required to bridge the gap between endless line and completely absent, the fluid slider between Absentlines and Fulllines worlds. That's how Absentlines' birthplace was changed forever... just by being introduced. The borderline kept report: \"Unlining logged,\" the silence commented, the Jester kept counting the lines that weren't there. The next day a new Residual Curl Events reported: \"A missing line continues participating in reality from an undefined coordinate. A hare's shadow arrived three minutes before the hare!\" The Great Curl finally commented: \"Counting changes what waits. The Constant of Intermittent Reality is not a measurement, but a dial\". Yet, Jester continued counting. For the first time in recorded history, the boundary appeared uncertain. And far away, in a place that didn't yet exist, a new hare opened one eye. An Intervaline. It already knew the Jester's number.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026",
    note: "Motto entered into the record:<br>Counting changes what waits." },
  { src: "images/ribbon-tangle-two-on-watch.jpg",
    title: "Drawingaline and absentlines hares ended up in the native Drawingaline's birthplace. They realized it when voices from inside the tension between the lines exclaimed: \"Ribbon Tangle, Two on Watch!\", but immediately entered the Continuum Linearis. Drawingaline halted first. Absentlines halted second. By the time their paws touched stillness, the borderline had already vanished behind them. Every strand visible in the dark was moving, though movement here resembled memory more than travel. \"Now your character makes sense,\" pronounced AbsentlineT stretching his ear and unfolding his leg. \"Recognition has been logged,\" pronounced AbsentlineD fascinated by himself being woven from line endings as if every unfinished sketch in existence had donated its last stroke. Drawingaline didn't know what to pronounce, so he just continued: \"Birthplaces can only be entered by those willing to leave them.\" The Continuum Linearis didn't think much and followed: \"Every departure is just a line waiting to loop back into its origin.\" All hares and the Continuum Linearis itself realized that they had not just arrived at an origin, they had become part of the weave itself. \"Recognition logged,\" the weave answered and kept them. Drawingaline looked down and saw that one of the luminous strands crossed his forepaw, entered his shadow, and exited somewhere behind a memory he had not yet remembered. This arrangement confused nobody because confusion itself had become another strand in the weave. They just watched, the way forgotten sketches might watch the hand that once drew them. The borderline pronounced too: \"Two on Watch became Two Within.\" And the weave continued drawing itself and carried the hares forward without moving them at all.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026",
    note: "Motto entered into the record:<br>Two on Watch became Two Within." },
  { src: "images/strawberry-ring-duty.jpg",
    title: "Drawingaline and absentlines hares caught the shooting stars and made a wishful ride around the universe. They were amused with a deliberative assembly — Strawberry Ring Duty — against aggressive phytate binding on the iron dust ring, one of the sessions of The 847th Deliberative Assembly on Mineral Bioavailability in Circumstellar Agricultural Systems, taking place on the citrus. Drawingaline noticed the delicate electromagnetic iron dust circles and hovered close enough to hear: The phytate chelation levels are far too high! If the aggressive binding isn't neutralized by dawn, the circumstellar soil will lose every trace of bioavailable iron, leaving the entire planetary grove anemic! The Absentline hare noticed a faint mist of essential oils released into the iron dust, as the citrus sighed. He out-competed phytates with the stellar magnesium and left strawberries in awe of the wonders they had witnessed.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026",
    note: "Session conclusion: The binding did not hold. Magnesium stood in line where iron was wanted, the phytates took the decoy and were satisfied, and the iron dust stayed what dust around a star should be — feed for a grove.<br>Motto entered into the record:<br>The strawberries kept the ring.<br>The citrus kept the minutes.<br>The hares rode home through the dawn side of the universe, anemic nowhere." },
  { src: "images/starfall-practice.jpg",
    title: "Drawingaline and absentlines hares overheard about a star falling wish coming true, but didn't know details how to detect that the star is falling, not rising. That set the time of Starfall Practice. The AbsentlineD set his time on eternity. The AbsentlineT jumped star-rope suggesting that at some point stars would be considered falling. The Drawingaline hare decided to fall himself, but gravity held him hanging on. “You're doing it wrong,” called AbsentlineT, still skipping star-rope through the dark. “To fall, you must first agree with down.” “I did agree,” said the Drawingaline hare. “I signed three agreements and drew down very carefully.” The problem was that nobody knew how to recognize a falling star. Since nothing was certain, Starfall Practice became a science of approximations. A terribly educational one. As a result, the falling star appeared. It landed on the Drawingaline ear. Nothing else happened. The hares waited. “So, what?” asked the falling star. “What what?” asked AbsentlineD. “The wish.” “We were expecting the falling star delivers the wish-coming-true”. “I only do the falling. Wishes are users-supplied.” That was disappointing but informative. AbsentlineD was ready to think eternally, AbsentlineT was ready to jump from one wish to another in circles. The Drawingaline hare was still suspended in thought. Finally, he said: “I wish to know the difference between falling and being held.” “You see,” the star flickered, “you signed three agreements with 'down,' but gravity wasn't trying to drop you. It was holding you upright so you could catch me.” AbsentlineD curled into infinity loop, satisfied with a clear eternity definition.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026",
    note: "Practice report: one star caught, zero wishes delivered, three agreements retired as unnecessary. Gravity had been holding everyone upright the whole time, which the hares recorded, carefully, as a result. And because nobody could determine whether the report was falling or merely being held by the page, Starfall Practice was scheduled again for the following eternity." },
  { src: "images/fourth-turn.jpg",
    title: "The drawingaline hare discovered the black hole. The drawingaline walked around it once, then twice, then four times, but from the fourth turn he realized it was the black square cubed. Instead of swallowed geometry the generated geometry emerged. He embraced it, because the phenomenon happened to be not an absence, but a container of absence, which is absolutely opposite thing! The drawingaline laughed at his mistake, infinite gravity happened to be folded inward three times cosmic void. That was the day of Law of the Fourth Turn: If a darkness can be circled, it is not yet the abyss. Examine its edges. An abyss has none. Absentline asked: “Now that you know it is a cubed square, Hare... will you enter through a face, an edge, or a corner?” “Neither a face nor an edge,” Drawingaline replied. “A corner is where three perspectives collide. Every boundary holds two truths at once: it is both a wall that contains and a doorway that invites. To enter through a corner is to choose every direction at once” So the drawingaline stepped in through the corner. Not around it. Not across it. Not into it. Through it... the black square, a wall from every side and a doorway from a single point, opened into all directions at once! The Black Square Cubed shuddered, for no traveler before had chosen the meeting point of three boundaries. Faces accepted direction. Edges accepted alternatives. But corners accepted paradox. The moment Drawingaline crossed, the cube ceased to behave like a container. It became a conversation. Each face spoke a different geometry. Each edge spoke a different transition. Each corner spoke all of them at once. The space inside was larger than outside, yet also smaller. Every path led away from every other path while secretly remaining the same path. Absentline followed and found something astonishing: in the center of the cubed square there was no center, but the river refused to flow, the question answered itself and the abyss that discovered the foundation. Another law was written. Law of the Corner Entry: When two truths meet, choose carefully. When three truths meet, choose courageously. For the corner is the place where every direction remembers it belongs to the same whole.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026" },
  { src: "images/moonrider.jpg",
    title: "“What if a future wishes to be visited?” Who didn't know it: the drawingaline was a moonrider. Once he found out about the amazing qualities of the buckminsterfullerene, he decided to modify the spheres to ride them instead of the moon. The moonrider altered the buckminsterfullerenes so they could be ridden through open space. The spheres became lighter than gravity and heavier than thought — a very unusual combination. At first, the moonrider simply traveled faster. Then the spheres began collecting things. Not dust. Not starlight. Possibilities. Every time a rider crossed a region of uncertainty, the modified fullerene lattice trapped unrealized futures inside its hexagons and pentagons. That's how the drawingaline, Moonrider, became the Keeper of Unchosen Worlds. Now, as the Keeper of Unchosen Worlds surveys the collection floating in the hexagons and pentagons, one of those trapped futures begins to shine softly. A path not taken suddenly starts to unspool into the dark space between the spheres. Shall we see where this unchosen path leads next, or introduce a new traveler to cross paths with the drawingaline?",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026",
    note: "One trapped future shines brighter than the rest — the path unfurls, the Keeper of Unchosen Worlds rides out to meet the world he never chose himself." },
  { src: "images/whirlwind-practice.jpg", title: "Stripslippet scheduled stars cleaning turned into whirlwind practice, which brought him into other universe, with the Spoton family watching in other direction on broken crescent moon. The Day Cleaning became the Star Vortex Travel into Spoton family. The Spoton family didn't expect a guest, but the dust of swept-off starlight fit perfectly on their spots. What felt like an accidental vortex was actually an invitation to shine together.", meta: "White gel on black paper miniature, 3.5×5.5, 2026", note: "Cleaning complete: the scheduled sweeping opened a Star Vortex, the Spoton spots caught the starlight dust, and the broken moon kept its bell. Nothing accidental — only an invitation to shine together... an invitation to shine together." }, { src: "images/striped-dance-upload.jpg", title: "The sun's dancing lesson for Thinstrip and Curlear, with the star-birds watching and mimicking Matisse ballet, led to the second lesson of the Truline study how to carry their shapes across the dark.", meta: "White gel on black paper miniature, 3.5×5.5, 2026", note: "The dark never swallowed their shapes — it only taught them how to carry themselves across it. After that, there were no more lessons. Only dancing." },

function render(works, gridId) {
  const grid = document.getElementById(gridId);
  works.forEach(w => {
    const card = document.createElement('div');
    card.className = 'card';
    const short = SHORT[w.src] || w.title;
    const rawTeaser = w.story || w.title || w.note || '';
    const teaser = rawTeaser.replace(/<[^>]*>/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    card.innerHTML = `<img src="${w.src}" alt="${short.replace(/"/g, '&quot;')}" loading="lazy"><h2>${short}</h2>${teaser ? `<p class="teaser">${teaser}</p>` : ''}`;
    card.addEventListener('click', () => {
      lbImg.src = w.src; lbImg.alt = w.title;
      lbTitle.textContent = w.title;
      lbStory.textContent = w.story || '';
      lbStory.style.display = w.story ? '' : 'none';
      lbMeta.innerHTML = metaHTML(w);
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
    grid.appendChild(card);
  });
}

render(NEW_WORKS, 'grid-new');
render(OLD_WORKS, 'grid-old');

function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('close').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
</script>
</body>
</html>
