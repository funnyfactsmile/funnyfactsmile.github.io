<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliceSmile — Portraits of invisible life</title>
<meta name="description" content="Drawings and pictures by AliceSmile, each with its name. Portraits of invisible life.">
<style>
  :root { --bg: #0b0b0c; --ink: #f2f0eb; --dim: #8a8781; --line: #232326; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; }
  header { text-align: center; padding: 56px 20px 12px; }
  header h1 { font-size: 2.2rem; font-weight: 400; letter-spacing: 0.14em; }
  header p { color: var(--dim); margin-top: 10px; font-style: italic; font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; padding: 36px clamp(16px, 5vw, 72px) 80px; max-width: 1400px; margin: 0 auto; }
  .card { cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid var(--line); transition: opacity .25s; background: #111; }
  .card:hover img { opacity: .82; }
  .card h2 { font-size: 0.98rem; font-weight: 400; margin-top: 12px; line-height: 1.45; }
  .card .meta { color: var(--dim); font-size: 0.82rem; margin-top: 6px; font-style: italic; }
  /* lightbox */
  #lightbox { position: fixed; inset: 0; background: rgba(5,5,6,.96); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  #lightbox.open { display: flex; }
  #lightbox figure { max-width: 1100px; width: 100%; max-height: 92vh; overflow: auto; text-align: center; }
  #lightbox img { max-width: 100%; max-height: 70vh; object-fit: contain; border: 1px solid var(--line); }
  #lightbox figcaption { margin-top: 18px; }
  #lightbox figcaption h2 { font-size: 1.25rem; font-weight: 400; line-height: 1.5; max-width: 800px; margin: 0 auto; }
  #lightbox figcaption .meta { color: var(--dim); font-style: italic; margin-top: 10px; }
  #close { position: fixed; top: 18px; right: 24px; background: none; border: none; color: var(--ink); font-size: 2rem; cursor: pointer; z-index: 51; font-family: inherit; }
  footer { text-align: center; padding: 0 20px 48px; color: var(--dim); font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>AliceSmile</h1>
  <p>Portraits of invisible life</p>
</header>
<main class="grid" id="grid"></main>
<footer>#LivingExpressionism</footer>

<div id="lightbox" role="dialog" aria-modal="true">
  <button id="close" aria-label="Close">&times;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption>
      <h2 id="lb-title"></h2>
      <div class="meta" id="lb-meta"></div>
    </figcaption>
  </figure>
</div>

<script>
// To add a work: copy one entry, change src / title / meta. Newest first.
const WORKS = [
  { src: "images/feather-inspection.jpg",
    title: "Changing seasons caught the duck with feathers inspection. Or: What you can find transitioning into winter first snow in the warm darkness of your breast. Anyways, the gliding bear kept warm.",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026" },
  { src: "images/launch-rehearsed.jpg",
    title: "The day of launching the Chrysopidae into rehearsed Mice play was crossed by Saturn rings running through Space rabbits discovery of the Goddess of the black hole. Or: Is it philosophy of the rehearsed ascent? Did we mess up planets, actually?",
    meta: "White gel on black paper miniature, 3.5×5.5, 2026" },
  { src: "images/dawn.jpg", title: "Dawn by the lake with sleeping moths", meta: "" },
  { src: "images/in-the-stardust.jpg", title: "In the stardust.", meta: "" },
  { src: "images/refraction.jpg", title: "The refraction of light, or The flickering of a thousand faces in the wing of a dragonfly.", meta: "Pastel and acrylic on cardboard, 2019" },
  { src: "images/siesta.jpg", title: "Siesta or the Falling Raven", meta: "" },
  { src: "images/crowd.jpg", title: "Screams of a crowd", meta: "" },
  { src: "images/nasturtiums.jpg", title: "Evening transformation of nasturtiums", meta: "" },
  { src: "images/butterfly.jpg", title: "Flickering of the iridescent blue in the sunlight or The butterfly effect.", meta: "Oil, 2024" },
  { src: "images/self-analysis.jpg", title: "An Attempt At Self Analysis or A Self Portrait Bust", meta: "Watercolor, pen on paper, 2024" },
  { src: "images/pulsation.jpg", title: "Fast Moving Pulsation or No apologies! For Who Was Late?", meta: "Watercolors, pen on paper, 2024" },
  { src: "images/dead.jpg", title: "Dead or Nothing to lose", meta: "" },
  { src: "images/calligraphy.jpg", title: "Calligraphy of the seasons", meta: "" },
  { src: "images/upsidedown.jpg", title: "The world was turned upside down", meta: "" },
  { src: "images/mercy.jpg", title: "Mercy", meta: "" },
];

const grid = document.getElementById('grid');
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbTitle = document.getElementById('lb-title');
const lbMeta = document.getElementById('lb-meta');

WORKS.forEach(w => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<img src="${w.src}" alt="${w.title.replace(/"/g, '&quot;')}" loading="lazy"><h2>${w.title}</h2>${w.meta ? `<div class="meta">${w.meta}</div>` : ''}`;
  card.addEventListener('click', () => {
    lbImg.src = w.src; lbImg.alt = w.title;
    lbTitle.textContent = w.title;
    lbMeta.textContent = w.meta || '';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  });
  grid.appendChild(card);
});

function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('close').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
</script>
</body>
</html>
